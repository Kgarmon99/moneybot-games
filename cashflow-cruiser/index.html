<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#07111F" />
<meta name="description" content="Practice balancing income, expenses, savings, and financial resilience." />
<meta property="og:title" content="Cashflow Cruiser" />
<meta property="og:description" content="Practice balancing income, expenses, savings, and financial resilience." />
<meta property="og:image" content="https://kgarmon99.github.io/moneybot-games/moneybot-official/assets/thumbs-signal/cashflow-cruiser.webp" />
<meta property="og:url" content="https://kgarmon99.github.io/moneybot-games/cashflow-cruiser/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Cashflow Cruiser" />
<meta name="twitter:description" content="Practice balancing income, expenses, savings, and financial resilience." />
<meta name="twitter:image" content="https://kgarmon99.github.io/moneybot-games/moneybot-official/assets/thumbs-signal/cashflow-cruiser.webp" />
<link rel="canonical" href="https://kgarmon99.github.io/moneybot-games/cashflow-cruiser/" />
<link rel="icon" type="image/webp" href="https://kgarmon99.github.io/moneybot-games/moneybot-official/assets/thumbs-signal/cashflow-cruiser.webp" />
<title>Cashflow Cruiser</title>
<link rel="stylesheet" href="../moneybot-official/assets/moneybot/moneybot-game.css?v=1" />
<link rel="stylesheet" href="style.css">

</head>
<body>
    <div id="game-container">
        <header class="mb-hud" id="hud" style="padding:14px;">
            <div class="mb-brand">
                <img src="../moneybot-official/assets/moneybot/assets/moneybot-logo-avatar.png" alt="MoneyBot" class="mb-brand-mark" />
                <div class="mb-title-group">
                    <p class="mb-kicker">MoneyBot Arcade</p>
                    <h1 class="mb-title" style="font-size:clamp(16px,4.5vw,24px);">Cashflow Cruiser</h1>
                </div>
            </div>
            <div class="mb-stat-row">
                <div class="mb-stat stat-pill" style="min-width:auto;padding:10px 16px;">
                    <span class="mb-stat-label">NET WORTH</span>
                    <span id="score-display" class="mb-stat-value" style="color:var(--mb-green);">$0</span>
                </div>
                <div class="mb-stat stat-pill" style="min-width:auto;padding:10px 16px;">
                    <span class="mb-stat-label">RUNWAY</span>
                    <span id="distance-display" class="mb-stat-value" style="color:var(--mb-green);">0m</span>
                </div>
            </div>
        </header>

        <main id="play-area">
            <canvas id="game-canvas"></canvas>
            <div id="particles"></div>
        </main>

        <div id="modal" class="modal active">
            <div class="modal-content">
                <h1 id="modal-title">Cashflow Cruiser</h1>
                <p id="modal-desc">Hold the screen to fire your Cashflow Jetpack and fly up. Release to fall. Dodge the red Debt Lasers and collect Green Dividends to build your Net Worth!</p>
                <button id="modal-btn" class="mb-btn-primary">START ENGINE</button>
            </div>
        </div>
    </div>
    
    <!-- Hide the image element used for canvas drawing -->
    <img id="mascot-img" src="assets/mascot.png" style="display:none;" alt="Mascot">
    
    <script src="game.js"></script>
</body>
</html>
