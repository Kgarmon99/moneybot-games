<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 284" width="464" height="284">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08120d"/>
      <stop offset="1" stop-color="#0d1f10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5bd41"/>
      <stop offset="1" stop-color="#d49a26"/>
    </linearGradient>
  </defs>
  <rect width="464" height="284" fill="url(#bg)"/>
  <!-- auction block / stage -->
  <rect x="42" y="42" width="380" height="200" rx="18" fill="none" stroke="#173820" stroke-width="2"/>
  <!-- podium -->
  <rect x="182" y="148" width="100" height="70" rx="8" fill="#0f2616" stroke="#1f452b" stroke-width="2"/>
  <text x="232" y="190" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" fill="#00e676">AUCTION</text>
  <!-- paddles -->
  <g transform="rotate(-12, 90, 128)">
    <rect x="74" y="96" width="32" height="64" rx="5" fill="#142a1c" stroke="#00e676" stroke-width="2"/>
    <circle cx="90" cy="160" r="10" fill="#00e676"/>
    <text x="90" y="136" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="900" fill="#00e676">17</text>
  </g>
  <g transform="rotate(10, 374, 128)">
    <rect x="358" y="96" width="32" height="64" rx="5" fill="#142a1c" stroke="#ff8c42" stroke-width="2"/>
    <circle cx="374" cy="160" r="10" fill="#ff8c42"/>
    <text x="374" y="136" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="900" fill="#ff8c42">42</text>
  </g>
  <!-- gavel -->
  <g transform="translate(232,78) rotate(15)">
    <rect x="-38" y="-10" width="76" height="20" rx="6" fill="url(#gold)"/>
    <rect x="26" y="-8" width="34" height="16" rx="4" fill="#b07d1d"/>
    <rect x="-6" y="10" width="12" height="44" rx="3" fill="#b07d1d"/>
  </g>
  <!-- lot card -->
  <rect x="176" y="42" width="112" height="70" rx="10" fill="#142a1c" stroke="#f5bd41" stroke-width="2"/>
  <text x="232" y="72" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#9caf9f">LOT 1</text>
  <text x="232" y="95" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="900" fill="#fff">VALUE</text>
</svg>